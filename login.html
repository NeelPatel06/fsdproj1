<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Versatile Website Template</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="light-mode">
    <header>
        <div class="logo">
            <h1>LOGO</h1>
        </div>
        <div class="nav-btns">
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
            <a href="index.html" class="login-btn">Home</a>
        </div>
    </header>

    <main>
        <section class="login-section">
            <div class="login-container">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to your account</p>
                </div>
                
                <div class="form-container">
                    <div class="tabs">
                        <button class="tab active" data-tab="login">Login</button>
                        <button class="tab" data-tab="register">Register</button>
                    </div>
                    
                    <div class="tab-content">
                        <!-- Login Form -->
                        <form id="login-form" class="active">
                            <div class="form-group">
                                <div class="input-icon">
                                    <i class="fas fa-user"></i>
                                    <input type="text" placeholder="Username or Email" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="input-icon">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" id="password" placeholder="Password" required>
                                    <i class="fas fa-eye toggle-password"></i>
                                </div>
                            </div>
                            <div class="form-options">
                                <div class="remember-me">
                                    <input type="checkbox" id="remember">
                                    <label for="remember">Remember me</label>
                                </div>
                                <a href="#" class="forgot-password">Forgot Password?</a>
                            </div>
                            <button type="submit" class="btn primary-btn login-submit">Sign In</button>
                            
                            <div class="social-login">
                                <p>Or login with</p>
                                <div class="social-icons">
                                    <button class="social-btn google"><i class="fab fa-google"></i></button>
                                    <button class="social-btn facebook"><i class="fab fa-facebook-f"></i></button>
                                    <button class="social-btn twitter"><i class="fab fa-twitter"></i></button>
                                </div>
                            </div>
                        </form>
                        
                        <!-- Register Form -->
                        <form id="register-form">
                            <div class="form-group">
                                <div class="input-icon">
                                    <i class="fas fa-user"></i>
                                    <input type="text" placeholder="Full Name" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="input-icon">
                                    <i class="fas fa-envelope"></i>
                                    <input type="email" placeholder="Email Address" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="input-icon">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" placeholder="Password" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="input-icon">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" placeholder="Confirm Password" required>
                                </div>
                            </div>
                            <div class="form-options">
                                <div class="accept-terms">
                                    <input type="checkbox" id="terms" required>
                                    <label for="terms">I accept the <a href="#">Terms of Service</a></label>
                                </div>
                            </div>
                            <button type="submit" class="btn primary-btn">Create Account</button>
                        </form>
                    </div>
                </div>
                
                <div class="login-footer">
                    <p>© 2025 Versatile Template</p>
                </div>
            </div>
            
            <div class="login-decoration">
                <div class="decoration-content">
                    <h2>Join Our Community</h2>
                    <p>Access all features and benefits by creating an account today.</p>
                    <div class="decoration-image">
                        <img src="/api/placeholder/400/300" alt="Login illustration">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
